name: Update Hot Data

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search query (for manual trigger)'
        required: false
        default: ''
      time_range:
        description: 'Time range (d/w/m/y)'
        required: false
        default: ''
      sort:
        description: 'Sort order (date)'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run hot data fetch script
        run: |
          cd scripts
          python fetch_hot_data.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ../data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update hot data [skip ci]"; git push)
        working-directory: ./scripts

      - name: Run search (if triggered manually)
        if: ${{ github.event.inputs.search_query != '' }}
        run: |
          cd scripts
          python fetch_hot_data.py --search "${{ github.event.inputs.search_query }}" --time-range "${{ github.event.inputs.time_range }}" --sort "${{ github.event.inputs.sort }}"
        env:
          SEARCH_ONLY: "1"

      - name: Commit search results
        if: ${{ github.event.inputs.search_query != '' }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ../data/search-results.json ../data/search-cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update search results [skip ci]"; git push)
        working-directory: ./scripts
