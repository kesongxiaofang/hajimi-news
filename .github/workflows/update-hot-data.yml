name: Update Hot Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search query'
        required: false
        default: ''
      time_range:
        description: 'Time range (d/w/m/y)'
        required: false
        default: ''
      sort:
        description: 'Sort by (date)'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install urllib3

      - name: Run hot data fetch
        run: python scripts/fetch_hot_data.py
        working-directory: ./

      - name: Commit hot data
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add data/*.json
          git commit -m "Update hot data" || echo "No changes"
          git push
        continue-on-error: true

      - name: Run search (if triggered)
        if: ${{ github.event.inputs.search_query != '' }}
        run: python scripts/fetch_hot_data.py --search "${{ github.event.inputs.search_query }}" --time-range "${{ github.event.inputs.time_range }}" --sort "${{ github.event.inputs.sort }}"
        working-directory: ./
        env:
          SEARCH_ONLY: "1"

      - name: Commit search results
        if: ${{ github.event.inputs.search_query != '' }}
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add data/search-results.json data/search-cache.json
          git commit -m "Update search results" || echo "No changes"
          git push
        continue-on-error: true
