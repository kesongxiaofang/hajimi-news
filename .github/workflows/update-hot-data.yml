name: Update Hot Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search query'
        required: false
        default: ''
      time_range:
        description: 'Time range (d/w/m/y)'
        required: false
        default: ''
      sort:
        description: 'Sort by (date)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install urllib3

      - name: Handle search query
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.search_query != ''
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.time_range }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --time-range ${{ github.event.inputs.time_range }}"
          fi
          if [ -n "${{ github.event.inputs.sort }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --sort ${{ github.event.inputs.sort }}"
          fi
          python scripts/fetch_hot_data.py --search "${{ github.event.inputs.search_query }}" $EXTRA_ARGS
        env:
          SEARCH_ONLY: "1"

      - name: Commit search results
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.search_query != ''
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add data/search-results.json data/search-cache.json
          git commit -m "Update search results" || echo "No changes"
          git push
        continue-on-error: true

      - name: Fetch hot data
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.search_query == ''
        run: python scripts/fetch_hot_data.py

      - name: Commit hot data
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.search_query == ''
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add data/*.json
          git commit -m "Update hot data" || echo "No changes"
          git push
        continue-on-error: true


