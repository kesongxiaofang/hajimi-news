name: Update Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search keyword (triggers web search)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Handle search query
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.search_query != ''
        run: |
          python scripts/fetch_hot_data.py --search "${{ github.event.inputs.search_query }}"

      - name: Fetch hot search data
        run: python scripts/fetch_hot_data.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: auto-update data [skip ci]"
          git push
